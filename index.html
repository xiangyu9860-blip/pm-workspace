<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 产品经理工作台</title>
  <!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#5B7CFA;--primary-light:#EEF2FF;--primary-dark:#4257D4;
      --bg:#F4F5F9;--card:#FFFFFF;--text:#1A1D29;--text2:#6B7280;--text3:#9CA3AF;
      --border:#E8EAF0;--border2:#D1D5DB;
      --red:#F05252;--red-bg:#FEF0F0;--amber:#F59E0B;--amber-bg:#FEF6E7;
      --green:#10B981;--green-bg:#E8F8F3;--blue:#3B82F6;--blue-bg:#EBF3FE;
      --purple:#8B5CF6;--purple-bg:#F3EEFF;--pink:#EC4899;--pink-bg:#FDF0F6;
      --gray:#6B7280;--gray-bg:#F3F4F7;
      --radius:16px;--radius-sm:12px;--radius-xs:8px;
      --shadow:0 1px 3px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.03);--shadow-md:0 6px 24px rgba(15,23,42,.08);--shadow-lg:0 12px 40px rgba(15,23,42,.12);
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    }
    html{font-size:15px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,124,250,.1)}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}
    ::-webkit-scrollbar-track{background:transparent}

    /* Header */
    .header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(15,23,42,.03)}
    .header-left{display:flex;align-items:center;gap:14px}
    .logo{display:flex;align-items:center;gap:10px}
    .logo svg{width:26px;height:26px;flex-shrink:0}
    .logo h1{font-size:17px;font-weight:700;letter-spacing:-.4px}
    .date-badge{font-size:12px;color:var(--text2);background:var(--gray-bg);padding:4px 12px;border-radius:20px;font-weight:500}
    .header-right{display:flex;align-items:center;gap:6px}
    .sync-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);margin-right:6px}
    .sync-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .sync-dot.offline .dot{background:var(--amber)}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all .2s ease;white-space:nowrap}
    .btn svg{width:15px;height:15px;flex-shrink:0}
    .btn-ghost{color:var(--text2);background:transparent;transition:all .2s ease}
    .btn-ghost:hover{background:var(--gray-bg);color:var(--text)}
    .btn-primary{color:#fff;background:var(--primary);transition:all .2s ease}
    .btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(91,124,250,.3)}
    .btn-outline{color:var(--primary);background:var(--primary-light);border:1px solid transparent;transition:all .2s ease}
    .btn-outline:hover{background:#E0E7FF}
    .btn-danger{color:var(--red);background:var(--red-bg);transition:all .2s ease}
    .btn-danger:hover{background:#FECACA}
    .btn-sm{padding:4px 10px;font-size:12px}
    .btn-icon{padding:6px;border-radius:var(--radius-xs)}
    .btn-icon svg{width:16px;height:16px}

    /* Today Section */
    .today-section{background:linear-gradient(135deg,#FFF9EB 0%,#FFF5E0 100%);border-bottom:1px solid #FDE68A;padding:14px 28px}
    .today-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .today-header h2{font-size:14px;font-weight:600;color:#92400E;display:flex;align-items:center;gap:6px}
    .today-header h2 svg{width:16px;height:16px}
    .today-list{display:flex;flex-wrap:wrap;gap:10px}
    .today-item{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 14px;font-size:13px;box-shadow:var(--shadow);transition:all .2s ease}
    .today-item:hover{box-shadow:var(--shadow-md)}
    .today-item.overdue{border-color:var(--red);background:var(--red-bg)}
    .today-item .tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0}
    .today-item .tag.red{background:var(--red);color:#fff}
    .today-item .tag.orange{background:var(--amber);color:#fff}
    .today-item .tag.blue{background:var(--blue);color:#fff}
    .today-item .name{color:var(--text);font-weight:500}
    .today-item .quick-btn{font-size:11px;color:var(--primary);font-weight:600;white-space:nowrap}
    .today-item .quick-btn:hover{text-decoration:underline}
    .today-empty{font-size:13px;color:var(--text3);padding:4px 0}

    /* Main Layout */
    .main{display:flex;gap:20px;padding:20px 28px;max-width:1600px;margin:0 auto;align-items:flex-start}
    .board{flex:1;min-width:0}
    .ai-panel{width:390px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);position:sticky;top:80px;overflow:hidden}

    /* Task Board */
    .board-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .board-col{background:var(--gray-bg);border-radius:var(--radius);display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 220px)}
    .col-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
    .col-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text)}
    .col-dot{width:8px;height:8px;border-radius:50%}
    .col-dot.todo{background:var(--gray)}
    .col-dot.doing{background:var(--blue)}
    .col-dot.done{background:var(--green)}
    .col-count{font-size:11px;color:var(--text3);background:var(--card);padding:2px 9px;border-radius:10px;font-weight:600}
    .col-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
    .col-footer{padding:8px 12px;border-top:1px solid var(--border)}
    .add-task-btn{width:100%;padding:10px;font-size:12px;color:var(--text3);border-radius:var(--radius-xs);transition:all .2s ease}
    .add-task-btn:hover{background:var(--card);color:var(--primary)}

    /* Task Card */
    .task-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s ease;position:relative}
    .task-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2);transform:translateY(-1px)}
    .task-card.overdue{border-left:3px solid var(--red)}
    .task-name{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.45;margin-bottom:6px}
    .task-desc{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .task-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
    .tag-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:3px}
    .tag-p0{background:var(--red-bg);color:var(--red)}
    .tag-p1{background:var(--amber-bg);color:#B45309}
    .tag-p2{background:var(--gray-bg);color:var(--gray)}
    .tag-cat{color:#fff}
    .tag-due{background:var(--gray-bg);color:var(--text2);display:inline-flex;align-items:center;gap:3px}
    .tag-due.overdue{background:var(--red-bg);color:var(--red)}
    .tag-due.today{background:var(--blue-bg);color:var(--blue)}
    .tag-due svg{width:11px;height:11px}
    .task-footer{display:flex;align-items:center;justify-content:space-between}
    .task-source{font-size:11px;color:var(--text3);display:inline-flex;align-items:center;gap:3px}
    .task-source svg{width:11px;height:11px}
    .task-actions{display:flex;gap:5px}
    .move-btn{font-size:11px;padding:4px 10px;border-radius:6px;font-weight:600;transition:all .2s ease}
    .move-btn.start{background:var(--blue-bg);color:var(--blue)}
    .move-btn.start:hover{background:var(--blue);color:#fff}
    .move-btn.complete{background:var(--green-bg);color:var(--green)}
    .move-btn.complete:hover{background:var(--green);color:#fff}
    .move-btn.reopen{background:var(--gray-bg);color:var(--gray)}
    .move-btn.reopen:hover{background:var(--gray);color:#fff}
    .card-del{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .2s ease;padding:3px;border-radius:6px}
    .task-card:hover .card-del{opacity:1}
    .card-del:hover{background:var(--red-bg);color:var(--red)}
    .card-del svg{width:14px;height:14px}

    /* AI Panel */
    .ai-header{padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--primary-light) 0%,transparent 100%)}
    .ai-header h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
    .ai-header h2 svg{width:18px;height:18px;color:var(--primary)}
    .ai-header p{font-size:12px;color:var(--text2);margin-top:5px}
    .ai-body{padding:18px 20px}
    .ai-textarea{width:100%;min-height:110px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;resize:vertical;line-height:1.6;transition:border-color .2s ease}
    .ai-textarea::placeholder{color:var(--text3)}
    .ai-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,124,250,.1)}
    .ai-hint{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.6}
    .ai-btn-row{display:flex;gap:8px;margin-top:12px}
    .ai-btn-row .btn{flex:1;justify-content:center}
    .decompose-result{margin-top:16px}
    .decompose-result h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .decompose-result h3 span{font-size:11px;color:var(--text3);font-weight:400}
    .decompose-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
    .decompose-item{background:var(--gray-bg);border:1px solid var(--border);border-radius:var(--radius-xs);padding:10px 12px;display:flex;align-items:flex-start;gap:8px;transition:all .2s ease}
    .decompose-item:hover{border-color:var(--border2)}
    .decompose-item input[type=checkbox]{margin-top:3px;flex-shrink:0;accent-color:var(--primary)}
    .decompose-item-content{flex:1;min-width:0}
    .decompose-item-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
    .decompose-item-name input{width:100%;border:none;background:transparent;font-weight:500;padding:0}
    .decompose-item-meta{display:flex;gap:6px;flex-wrap:wrap}
    .decompose-item-meta select{font-size:11px;padding:1px 4px;border:1px solid var(--border);border-radius:3px;background:var(--card)}
    .decompose-item .del{flex-shrink:0;color:var(--text3);padding:2px}
    .decompose-item .del:hover{color:var(--red)}
    .decompose-item .del svg{width:14px;height:14px}
    .decompose-empty{text-align:center;padding:20px;font-size:13px;color:var(--text3)}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
    .modal-overlay.active{display:flex}
    .modal{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
    .modal-header h3{font-size:16px;font-weight:700}
    .modal-close{padding:5px;border-radius:var(--radius-xs);color:var(--text3);transition:all .2s ease}
    .modal-close:hover{background:var(--gray-bg);color:var(--text)}
    .modal-close svg{width:20px;height:20px}
    .modal-body{padding:24px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
    .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:border-color .2s ease}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,124,250,.1)}
    .form-group textarea{min-height:76px;resize:vertical}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 24px}

    /* Report Modal */
    .report-modal{max-width:680px}
    .report-content{background:var(--gray-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 20px;font-size:13px;line-height:1.85;color:var(--text);font-family:var(--font);max-height:50vh;overflow-y:auto;width:100%;border:1px solid var(--border);outline:none;resize:vertical;min-height:280px;transition:border-color .2s ease}
    .report-content:focus{border-color:var(--primary);background:#fff}
    .report-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
    .report-actions{display:flex;align-items:center;gap:8px}
    .report-author{width:72px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;font-family:var(--font);color:var(--text);outline:none;transition:border-color .2s ease;background:transparent}
    .report-author:focus{border-color:var(--primary)}
    .report-tabs{display:flex;gap:6px}
    .report-tab{padding:7px 18px;border-radius:var(--radius-xs);font-size:13px;font-weight:500;color:var(--text2);background:transparent;transition:all .2s ease;cursor:pointer;border:none;font-family:var(--font)}
    .report-tab.active{background:var(--primary);color:#fff}
    .report-tab:hover:not(.active){background:var(--gray-bg)}
    .btn-regenerate{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:1px solid var(--border);transition:all .2s ease;cursor:pointer;font-family:var(--font)}
    .btn-regenerate:hover{border-color:var(--primary);color:var(--primary);background:rgba(99,102,241,.04)}

    /* Confirm Dialog */
    .confirm-modal{max-width:380px}
    .confirm-modal .modal-body{text-align:center;padding:28px 24px}
    .confirm-modal .modal-body p{font-size:14px;color:var(--text);margin-bottom:8px}
    .confirm-modal .modal-body .sub{font-size:12px;color:var(--text2)}
    .confirm-modal .modal-footer{justify-content:center;padding-bottom:24px}

    /* Toast */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:300;opacity:0;transition:all .3s ease;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .toast.warn{background:var(--amber)}

    /* Responsive */
    @media(max-width:1024px){
      .main{flex-direction:column;padding:16px;gap:16px}
      .ai-panel{width:100%;position:static}
      .board-cols{grid-template-columns:1fr 1fr;gap:12px}
      .board-col:nth-child(3){grid-column:1/-1}
    }
    @media(max-width:640px){
      .header{padding:0 14px;height:52px}
      .logo h1{font-size:15px}
      .date-badge{display:none}
      .header-right .btn-label{display:none}
      .header-right .btn{padding:6px 8px}
      .today-section{padding:12px 14px}
      .main{padding:12px 14px;gap:12px}
      .board-cols{grid-template-columns:1fr;gap:10px}
      .board-col{min-height:auto;max-height:none}
      .board-col .col-list{max-height:300px}
      .form-row{grid-template-columns:1fr}
      input,textarea,select{font-size:16px!important}
    }
    /* Learning Badge */
    .learn-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--purple-bg);color:var(--purple);cursor:pointer;transition:all .15s}
    .learn-badge:hover{background:#DDD6FE}
    .learn-badge svg{width:12px;height:12px}
    .learn-badge.zero{display:none}
    .applied-tip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--purple);font-weight:500;margin-top:4px}
    .applied-tip svg{width:12px;height:12px;flex-shrink:0}

    /* Add task in decompose */
    .decompose-add{border:1px dashed var(--border2);border-radius:var(--radius-xs);padding:7px;text-align:center;font-size:12px;color:var(--text3);cursor:pointer;transition:all .15s;margin-top:4px}
    .decompose-add:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

    /* Learning Panel */
    .learn-panel{max-width:560px}
    .learn-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .learn-stat{background:var(--gray-bg);border-radius:var(--radius-sm);padding:14px 8px;text-align:center}
    .learn-stat .num{font-size:24px;font-weight:700;color:var(--primary);line-height:1.2}
    .learn-stat .label{font-size:10px;color:var(--text2);margin-top:3px}
    .learn-rule{background:var(--gray-bg);border-radius:var(--radius-xs);padding:8px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
    .learn-rule .arrow{color:var(--text3);margin:0 4px}
    .learn-rule .count{font-size:10px;color:#fff;background:var(--purple);padding:2px 8px;border-radius:8px;font-weight:600;flex-shrink:0}
    .learn-section-title{font-size:12px;font-weight:600;margin:14px 0 8px;color:var(--text);display:flex;align-items:center;gap:5px}
    .learn-section-title svg{width:13px;height:13px;color:var(--primary)}
    .learn-empty{text-align:center;padding:28px 12px;color:var(--text3);font-size:13px}
    .learn-history-item{background:var(--gray-bg);border-radius:var(--radius-xs);padding:10px 12px;margin-bottom:6px;font-size:12px}
    .learn-history-item .date{font-weight:600;color:var(--text2);margin-bottom:2px}
    .learn-history-item .change{color:var(--text3);line-height:1.6}

    .hidden{display:none!important}
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" fill="#4F6BED"/><path d="M8 12l2.5 2.5L16 9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="7" r="1.5" fill="#fff"/><circle cx="16" cy="17" r="1.5" fill="#fff"/></svg>
        <h1>AI 产品经理工作台</h1>
      </div>
      <span class="date-badge" id="dateBadge"></span>
    </div>
    <div class="header-right">
      <span class="sync-dot" id="syncDot"><span class="dot"></span><span id="syncText">已同步</span></span>
      <button class="btn btn-ghost btn-sm" onclick="exportData()" title="导出JSON备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-label">导出</span>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()" title="导入JSON恢复">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-label">导入</span>
      </button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
      <button class="btn btn-outline btn-sm" onclick="generateReport('daily')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-label">日报</span>
      </button>
      <button class="btn btn-primary btn-sm" onclick="generateReport('weekly')">

  <script>
    /* ===== Config ===== */
    var DATABASE_ID = 'lttgJ8x69yUpySHh7rWQBp';
    var STORAGE_KEY = 'wb_pm_workspace_tasks';
    var hasSDK = !!(window.__SMART_PAGE__ && window.__SMART_PAGE__.database);
    var db = hasSDK ? window.__SMART_PAGE__.database : null;
    var SCHEMA_OPTIONS = {};
    var OPTIONS_MAP = {};
    var allTasks = [];
    var editingTaskId = null;
    var decomposedTasks = [];
    var currentReportType = 'daily';
    var currentReportText = '';

    /* ===== Learning System ===== */
    var LEARNING_KEY = 'wb_pm_learning_v1';
    var learningData = null;
    var originalDecompose = null;
    var lastDecomposeInput = '';

    function initLearningData(){
      return {
        version:1, totalSessions:0,
        priorityChanges:{},      // 'P0→P1': count
        categoryChanges:{},      // '需求分析→项目协调': count
        dueDateDelta:{total:0,count:0},  // average date shift
        deletedKeywords:{},      // '评审': count
        addedTemplates:[],       // [{name,category,priority,count}]
        nameEdits:{shortened:0,lengthened:0,total:0},
        appliedRules:[],         // rules applied in last decomposition
        history:[]               // [{date,input,changes:[]}]
      };
    }

    function loadLearning(){
      try{
        var raw=localStorage.getItem(LEARNING_KEY);
        learningData=raw?JSON.parse(raw):initLearningData();
        if(!learningData.version)learningData=initLearningData();
      }catch(e){learningData=initLearningData()}
      updateLearnBadge();
    }

    function saveLearning(){
      try{localStorage.setItem(LEARNING_KEY,JSON.stringify(learningData))}catch(e){}
    }

    function updateLearnBadge(){
      var badge=document.getElementById('learnBadge');
      var countEl=document.getElementById('learnBadgeCount');
      if(!badge||!countEl)return;
      var n=learningData?learningData.totalSessions:0;
      countEl.textContent=n;
      badge.classList.toggle('zero',n===0);
    }

    function updateAppliedTip(){
      var tip=document.getElementById('appliedTip');
      if(!tip)return;
      var rules=learningData?learningData.appliedRules:[];
      if(rules.length===0){tip.classList.add('hidden');return}
      tip.classList.remove('hidden');
      tip.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke-linecap="round" stroke-linejoin="round"/></svg>已根据你的习惯优化 '+rules.length+' 项';
    }

    function extractKeywords(name){
      var stopWords=['的','和','与','及','或','完成','整理','梳理','制定','组织','准备','输出','进行','确定','明确','设计','开发','规划','安排','跟进','推进','相关','核心'];
      var cleaned=name;
      stopWords.forEach(function(w){cleaned=cleaned.replace(new RegExp(w,'g'),' ')});
      var words=cleaned.split(/[\s,，、。:：;；()（）]+/).filter(function(w){return w.length>=2});
      return words.length>0?words:[name.substring(0,4)];
    }

    function applyLearning(tasks){
      if(!learningData||learningData.totalSessions===0){
        if(learningData)learningData.appliedRules=[];
        return tasks;
      }
      var applied=[];

      // 1. Priority changes (threshold: 2+ times)
      Object.keys(learningData.priorityChanges).forEach(function(key){
        if(learningData.priorityChanges[key]>=2){
          var parts=key.split('\u2192');
          var fromPri=parts[0],toPri=parts[1];
          var changed=false;
          tasks.forEach(function(t){
            if(t.priority===fromPri){t.priority=toPri;changed=true}
          });
          if(changed)applied.push('优先级 '+fromPri+' → '+toPri+'（'+learningData.priorityChanges[key]+'次）');
        }
      });

      // 2. Category changes
      Object.keys(learningData.categoryChanges).forEach(function(key){
        if(learningData.categoryChanges[key]>=2){
          var parts=key.split('\u2192');
          var fromCat=parts[0],toCat=parts[1];
          var changed=false;
          tasks.forEach(function(t){
            if(t.category===fromCat){t.category=toCat;changed=true}
          });
          if(changed)applied.push('分类 '+fromCat+' → '+toCat+'（'+learningData.categoryChanges[key]+'次）');
        }
      });

      // 3. Due date delta
      if(learningData.dueDateDelta.count>=2){
        var avgDelta=Math.round(learningData.dueDateDelta.total/learningData.dueDateDelta.count);
        if(avgDelta!==0){
          tasks.forEach(function(t){
            var d=new Date(t.dueDate);
            d.setDate(d.getDate()+avgDelta);
            t.dueDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          });
          applied.push('截止日期'+(avgDelta>0?'延后':'提前')+Math.abs(avgDelta)+'天（'+learningData.dueDateDelta.count+'次）');
        }
      }

      // 4. Filter tasks with frequently deleted keywords
      Object.keys(learningData.deletedKeywords).forEach(function(kw){
        if(learningData.deletedKeywords[kw]>=2){
          var before=tasks.length;
          tasks=tasks.filter(function(t){return t.name.indexOf(kw)===-1});
          if(tasks.length<before)applied.push('过滤含"'+kw+'"的任务（'+learningData.deletedKeywords[kw]+'次删除）');
        }
      });

      // 5. Name shortening preference
      if(learningData.nameEdits.total>=3&&learningData.nameEdits.shortened>learningData.nameEdits.lengthened){
        tasks.forEach(function(t){
          if(t.name.length>18){
            var cut=t.name.lastIndexOf('，');
            if(cut>6&&cut<t.name.length-3){t.name=t.name.substring(0,cut)}
          }
        });
        applied.push('任务名称精简化（'+learningData.nameEdits.shortened+'次缩短）');
      }

      learningData.appliedRules=applied;
      return tasks;
    }

    function recordLearning(input,original,final){
      if(!learningData)loadLearning();
      learningData.totalSessions++;
      var changes=[];

      // Build maps
      var origMap={};
      original.forEach(function(t){if(t._oid)origMap[t._oid]=t});
      var finalIds={};
      final.forEach(function(t){if(t._oid)finalIds[t._oid]=true});

      // Check modifications on surviving tasks
      final.forEach(function(t){
        if(t._oid&&origMap[t._oid]){
          var orig=origMap[t._oid];
          if(orig.priority!==t.priority){
            var key=orig.priority+'\u2192'+t.priority;
            learningData.priorityChanges[key]=(learningData.priorityChanges[key]||0)+1;
            changes.push('优先级 '+key);
          }
          if(orig.category!==t.category){
            var ck=orig.category+'\u2192'+t.category;
            learningData.categoryChanges[ck]=(learningData.categoryChanges[ck]||0)+1;
            changes.push('分类 '+ck);
          }
          if(orig.dueDate!==t.dueDate){
            var od=new Date(orig.dueDate),nd=new Date(t.dueDate);
            var delta=Math.round((nd-od)/86400000);
            if(!isNaN(delta)&&delta!==0){
              learningData.dueDateDelta.total+=delta;
              learningData.dueDateDelta.count++;
              changes.push('日期'+(delta>0?'+':'')+delta+'天');
            }
          }
          if(orig.name!==t.name){
            learningData.nameEdits.total++;
            if(t.name.length<orig.name.length)learningData.nameEdits.shortened++;
            if(t.name.length>orig.name.length)learningData.nameEdits.lengthened++;
            changes.push('重命名"'+orig.name.substring(0,12)+'..."');
          }
        } else if(!t._oid||!origMap[t._oid]){
          // User-added task
          changes.push('新增: '+t.name);
        }
      });

      // Check deleted tasks
      original.forEach(function(t){
        if(!finalIds[t._oid]){
          var kws=extractKeywords(t.name);
          kws.forEach(function(kw){
            learningData.deletedKeywords[kw]=(learningData.deletedKeywords[kw]||0)+1;
          });
          changes.push('删除: '+t.name.substring(0,12));
        }
      });

      // Record history
      learningData.history.push({date:todayStr(),input:input.substring(0,60),changes:changes});
      if(learningData.history.length>20)learningData.history=learningData.history.slice(-20);

      saveLearning();
      updateLearnBadge();
    }

    function openLearnPanel(){
      renderLearnPanel();
      document.getElementById('learnOverlay').classList.add('active');
    }

    function closeLearnPanel(){
      document.getElementById('learnOverlay').classList.remove('active');
    }

    function renderLearnPanel(){
      var body=document.getElementById('learnBody');
      if(!learningData||learningData.totalSessions===0){
        body.innerHTML='<div class="learn-empty">还没有学习记录。<br>当你调整AI拆解结果并添加到任务板后，<br>系统会自动记录你的偏好，后续拆解越来越精准。</div>';
        return;
      }

      var html='';

      // Stats
      var ruleCount=Object.keys(learningData.priorityChanges).filter(function(k){return learningData.priorityChanges[k]>=2}).length
        +Object.keys(learningData.categoryChanges).filter(function(k){return learningData.categoryChanges[k]>=2}).length
        +(learningData.dueDateDelta.count>=2?1:0)
        +Object.keys(learningData.deletedKeywords).filter(function(k){return learningData.deletedKeywords[k]>=2}).length;
      var lastApplied=learningData.appliedRules.length;

      html+='<div class="learn-stats">';
      html+='<div class="learn-stat"><div class="num">'+learningData.totalSessions+'</div><div class="label">学习次数</div></div>';
      html+='<div class="learn-stat"><div class="num">'+ruleCount+'</div><div class="label">已掌握规则</div></div>';
      html+='<div class="learn-stat"><div class="num">'+lastApplied+'</div><div class="label">本次应用</div></div>';
      html+='</div>';

      // Priority rules
      var priRules=Object.keys(learningData.priorityChanges).filter(function(k){return learningData.priorityChanges[k]>=1}).sort(function(a,b){return learningData.priorityChanges[b]-learningData.priorityChanges[a]});
      if(priRules.length>0){
        html+='<div class="learn-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/></svg>优先级偏好</div>';
        priRules.forEach(function(k){
          var parts=k.split('\u2192');
          html+='<div class="learn-rule"><span>'+parts[0]+'<span class="arrow">→</span>'+parts[1]+'</span><span class="count">'+learningData.priorityChanges[k]+'次</span></div>';
        });
      }

      // Category rules
      var catRules=Object.keys(learningData.categoryChanges).filter(function(k){return learningData.categoryChanges[k]>=1}).sort(function(a,b){return learningData.categoryChanges[b]-learningData.categoryChanges[a]});
      if(catRules.length>0){
        html+='<div class="learn-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h.01M7 3h5a1.99 1.99 0 011.99 2v0a1.99 1.99 0 01-1.99 2H7m0 0h10a2 2 0 012 2v0M7 7H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>分类偏好</div>';
        catRules.forEach(function(k){
          var parts=k.split('\u2192');
          html+='<div class="learn-rule"><span>'+parts[0]+'<span class="arrow">→</span>'+parts[1]+'</span><span class="count">'+learningData.categoryChanges[k]+'次</span></div>';
        });
      }

      // Due date preference
      if(learningData.dueDateDelta.count>0){
        var avg=Math.round(learningData.dueDateDelta.total/learningData.dueDateDelta.count);
        html+='<div class="learn-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/></svg>日期偏好</div>';

          return db.addRecord({databaseId:DATABASE_ID,properties:props}).catch(function(e){console.error('[db] add error:',e,'props:',JSON.stringify(props));throw e});
        } else {
          return new Promise(function(res){
            var tasks=[];
            var data=localStorage.getItem(STORAGE_KEY);
            if(data){try{tasks=JSON.parse(data)}catch(e){}}
            var unwrapped={};
            Object.keys(props).forEach(function(k){
              var v=props[k];
              if(v&&typeof v==='object'){var t=Object.keys(v)[0];unwrapped[k]=v[t]}
            });
            unwrapped._id=genId();
            tasks.push(unwrapped);
            localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));
            res({id:unwrapped._id});
          });
        }
      },
      updateRecord: function(rid,props){
        if(hasSDK){
          return db.updateRecord({databaseId:DATABASE_ID,recordId:rid,properties:props}).catch(function(e){console.error('[db] update error:',e,'props:',JSON.stringify(props));throw e});
        } else {
          return new Promise(function(res){
            var tasks=[];
            var data=localStorage.getItem(STORAGE_KEY);
            if(data){try{tasks=JSON.parse(data)}catch(e){}}
            var idx=tasks.findIndex(function(t){return t._id===rid});
            if(idx!==-1){
              Object.keys(props).forEach(function(k){
                var v=props[k];
                if(v&&typeof v==='object'){var t=Object.keys(v)[0];tasks[idx][k]=v[t]}else{tasks[idx][k]=v}
              });
              localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));
            }
            res({id:rid});
          });
        }
      },
      deleteRecord: function(rid){
        if(hasSDK){
          return db.deleteRecord({databaseId:DATABASE_ID,recordId:rid}).catch(function(e){console.error('[db] delete error:',e);throw e});
        } else {
          return new Promise(function(res){

            if(data){try{tasks=JSON.parse(data)}catch(e){}}
            tasks=tasks.filter(function(t){return t._id!==rid});

            res({});
          });
        }
      },

        }

    function scoreScenario(text,scenario){
      var score=0,matched=0;
      scenario.keywords.forEach(function(k){
        if(text.indexOf(k.w)!==-1){score+=k.s;matched++}
      });
      if(matched===0)return 0;
      if(scenario.minScore&&score<scenario.minScore)return 0;
      return score;
    }

    function decomposeTask(input){
      if(!input||!input.trim())return [];

      var segments=parseTimeSegments(input);
      var today=new Date();
      var result=[];

      segments.forEach(function(seg,segIdx){
        var text=seg.text.toLowerCase();
        var subject=extractSubject(seg.text);

        var best=null,bestScore=0;
        SCENARIOS.forEach(function(s){
          var sc=scoreScenario(text,s);
          if(sc>bestScore){bestScore=sc;best=s}
        });

        var tasks;
        if(best&&(bestScore>=2||(segments.length===1&&bestScore>0))){
          tasks=best.template(subject);
        } else {
          tasks=[
            {name:'明确'+subject+'的目标和范围',cat:'其他',pri:'P0',days:1},
            {name:'拆解'+subject+'关键步骤和依赖',cat:'项目协调',pri:'P1',days:1},
            {name:'推进'+subject+'执行并协调资源',cat:'其他',pri:'P1',days:3},
            {name:'验收'+subject+'成果并总结复盘',cat:'其他',pri:'P2',days:5}
          ];
        }

        var segDue=addDays(today,seg.offsetDays);
        var segPl=classifyProjectLine(seg.text);
        tasks.forEach(function(t,idx){
          var dStr=formatDate(segDue);
          result.push({
            _oid:'dec_'+segIdx+'_'+idx+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            name:t.name,desc:seg.label?('【'+seg.label+'】'+seg.text):'',status:'待办',priority:t_pri(t.pri),category:t.cat,projectLine:segPl,dueDate:dStr,
            checked:true,editing:false
          });
        });
      });

      // Apply learned patterns
      result=applyLearning(result);
      return result;
    }

    function addDays(base,n){
      var d=new Date(base);
      if(n==='eom'){
        d.setMonth(d.getMonth()+1,0);
        return d;
      }
      d.setDate(base.getDate()+n);
      return d;
    }

    function formatDate(d){
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }

    function parseTimeSegments(input){
      var markers=[
        {re:/今天[内]?|今日/g,offset:0,label:'今天'},
        {re:/明天|明日/g,offset:1,label:'明天'},
        {re:/后天/g,offset:2,label:'后天'},
        {re:/本周[内]?/g,offset:4,label:'本周'},
        {re:/下周/g,offset:7,label:'下周'},
        {re:/下月|下个月/g,offset:30,label:'下月'},
        {re:/月底|月末/g,offset:'eom',label:'月底'}
      ];

      var positions=[];
      markers.forEach(function(m){
        var match;
        // reset lastIndex
        m.re.lastIndex=0;
        while((match=m.re.exec(input))!==null){
          positions.push({pos:match.index,matched:match[0],marker:m});
        }
      });
      positions.sort(function(a,b){return a.pos-b.pos});

      if(positions.length===0){
        return [{text:input,offsetDays:1,label:''}];
      }

      // If only one marker at start, treat rest as single segment
      if(positions.length===1){
        var m=positions[0];
        var segText=input.substring(m.pos+m.matched.length).trim().replace(/^[，,、；;：:]/,'').trim();
        if(!segText)segText=input;
        return [{text:segText,offsetDays:m.marker.offset,label:m.marker.label}];
      }

      var segments=[];
      for(var i=0;i<positions.length;i++){
        var start=positions[i].pos+positions[i].matched.length;
        var end=i<positions.length-1?positions[i+1].pos:input.length;
        var segText=input.substring(start,end).trim().replace(/^[，,、；;：:]/,'').trim();
        if(segText){
          segments.push({text:segText,offsetDays:positions[i].marker.offset,label:positions[i].marker.label});
        }
      }
      if(segments.length===0){
        return [{text:input,offsetDays:1,label:''}];
      }
      return segments;
    }

    function t_pri(p){return p}

    function matchAny(text,keywords){
      return keywords.some(function(k){return text.indexOf(k)!==-1});
    }

    function extractSubject(input){
      var cleaned=input.replace(/^(我要|我需要|帮我|请|完成|做|进行|开始|准备|设计|开发|规划|安排|组织)/,'').trim();
      // strip time marker prefix if present
      cleaned=cleaned.replace(/^(今天[内]?|今日|明天|明日|后天|本周[内]?|下周|下月|下个月|月底|月末)[，,、；;：:]/,'').trim();
      if(cleaned.length>30)cleaned=cleaned.substring(0,30);
      if(!cleaned)cleaned=input.trim().substring(0,30);
      return cleaned;
    }

    function renderCol(listId,countId,tasks,status){
      document.getElementById(countId).textContent=tasks.length;
      var container=document.getElementById(listId);
      if(tasks.length===0){
        container.innerHTML='<div style="text-align:center;padding:20px;font-size:12px;color:var(--text3)">暂无任务</div>';
        return;
      }
      // Sort: overdue first, then by priority, then by due date
      tasks.sort(function(a,b){
        var ao=isOverdue(a)?1:0,bo=isOverdue(b)?1:0;
        if(ao!==bo)return bo-ao;
        var po=priOrder(a['优先级'])-priOrder(b['优先级']);
        if(po!==0)return po;
        return (parseDate(a['截止日期'])||0)-(parseDate(b['截止日期'])||0);
      });
      container.innerHTML=tasks.map(function(t){return taskCardHTML(t,status)}).join('');
    }

    function priOrder(p){
      if(p==='P0')return 0;
      if(p==='P1')return 1;
      return 2;
    }

    function saveTask(){
      var name=document.getElementById('fName').value.trim();
      if(!name){showToast('请输入任务名称',true);return}
      var desc=document.getElementById('fDesc').value.trim();
      var status=document.getElementById('fStatus').value;
      var priority=document.getElementById('fPriority').value;
      var category=document.getElementById('fCategory').value;
      var projectLine=document.getElementById('fProjectLine').value;
      var dueDate=document.getElementById('fDueDate').value;

      var sourceText=editingTaskId?(allTasks.find(function(t){return t._id===editingTaskId})||{})['来源']||'手动添加':'手动添加';
      var props={
        '任务名称':{'text':name},
        '任务描述':{'text':desc},
        '状态':{'select':selectVal('状态',status)},
        '优先级':{'select':selectVal('优先级',priority)},
        '分类':{'select':selectVal('分类',category)},
        '项目线':{'select':selectVal('项目线',projectLine)},
        '截止日期':{'date':dueDate},
        '来源':{'select':selectVal('来源',sourceText)}
      };

      if(status==='已完成'){
        if(!editingTaskId||(allTasks.find(function(t){return t._id===editingTaskId})||{})['状态']!=='已完成'){
          props['完成日期']={'date':todayStr()};
        }
      }

      if(editingTaskId){
        props['创建日期']={'date':fmtDate((allTasks.find(function(t){return t._id===editingTaskId})||{})['创建日期'])||todayStr()};
        if(status!=='已完成'){
          props['完成日期']={'date':null};
        }
        DataStore.updateRecord(editingTaskId,props).then(function(){
          showToast('任务已更新');
          closeTaskModal();
          loadData();
        }).catch(function(e){console.error('[save] update error:',e);showToast('保存失败：'+(e&&e.message?e.message:'请重试'),true)});
      } else {
        props['创建日期']={'date':todayStr()};
        if(status==='已完成'){
          props['完成日期']={'date':todayStr()};
        }
        DataStore.addRecord(props).then(function(){
          showToast('任务已添加');
          closeTaskModal();
          loadData();
        }).catch(function(e){console.error('[save] add error:',e);showToast('添加失败：'+(e&&e.message?e.message:'请重试'),true)});
      }
    }

      document.getElementById('decomposeCount').textContent=decomposedTasks.filter(function(t){return t.checked}).length+' 项任务';
    }

    function addDecomposeItem(){
      var d=new Date();d.setDate(d.getDate()+3);
      var dStr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      decomposedTasks.push({
        _oid:null,
        name:'新任务',desc:'',status:'待办',priority:'P2',category:'其他',projectLine:'其他',
        dueDate:dStr,checked:true,editing:false
      });
      renderDecomposeList();
      // Focus the last item's name input
      setTimeout(function(){
        var inputs=document.querySelectorAll('#decomposeList .decompose-item-name input');
        if(inputs.length>0){inputs[inputs.length-1].focus();inputs[inputs.length-1].select()}
      },50);
    }

    function addDecomposedToBoard(){
      var checked=decomposedTasks.filter(function(t){return t.checked});
      if(checked.length===0){showToast('请至少选择一项任务',true);return}

      // Record learning if we have original snapshot
      if(originalDecompose&&originalDecompose.length>0){
        recordLearning(lastDecomposeInput,originalDecompose,decomposedTasks);
        var appliedCount=learningData.appliedRules.length;
        var msg='已添加 '+checked.length+' 项任务';
        if(learningData.totalSessions>=2){
          msg+=' · AI已学习'+learningData.totalSessions+'次';
        }
        showToast(msg);
      } else {
        showToast('已添加 '+checked.length+' 项任务到任务板');
      }

      var promises=checked.map(function(t){
        return DataStore.addRecord({
          '任务名称':{'text':t.name},
          '任务描述':{'text':''},
          '状态':{'select':selectVal('状态','待办')},
          '优先级':{'select':selectVal('优先级',t.priority)},
          '分类':{'select':selectVal('分类',t.category)},
          '项目线':{'select':selectVal('项目线',t.projectLine||classifyProjectLine(t.name))},
          '截止日期':{'date':t.dueDate},
          '创建日期':{'date':todayStr()},
          '来源':{'select':selectVal('来源','AI拆解')}
        });
      });
      Promise.all(promises).then(function(){
        decomposedTasks=[];
        originalDecompose=null;
        document.getElementById('aiInput').value='';
        document.getElementById('decomposeResult').classList.add('hidden');
        var tip=document.getElementById('appliedTip');
        if(tip)tip.classList.add('hidden');
        loadData();
      }).catch(function(e){console.error('[decompose] add error:',e);showToast('部分任务添加失败：'+(e&&e.message?e.message:''),true)});
    }

    /* ===== Direct Add (no AI decompose) ===== */
    function directAddToBoard(){
      var input=document.getElementById('aiInput').value.trim();
      if(!input){showToast('请先输入工作内容',true);return}
      var d=new Date();d.setDate(d.getDate()+3);
      var dStr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      DataStore.addRecord({
        '任务名称':{'text':input},
        '任务描述':{'text':''},
        '状态':{'select':selectVal('状态','待办')},
        '优先级':{'select':selectVal('优先级','P2')},
        '分类':{'select':selectVal('分类','其他')},
        '项目线':{'select':selectVal('项目线',classifyProjectLine(input))},
        '截止日期':{'date':dStr},
        '创建日期':{'date':todayStr()},
        '来源':{'select':selectVal('来源','手动添加')}

        document.getElementById('aiInput').value='';
        document.getElementById('decomposeResult').classList.add('hidden');
        showToast('已添加到任务板');
        loadData();
      }).catch(function(e){console.error('[directAdd] error:',e);showToast('添加失败：'+(e&&e.message?e.message:''),true)});
    }

    /* ===== Report ===== */
    var reportEdits={}; // 保存每种类型的手动编辑内容
    var CN_NUM=['零','一','二','三','四','五','六','七','八','九','十'];

    function generateReport(type){
      currentReportType=type;
      switchReportTab(type);
      document.getElementById('reportModalOverlay').classList.add('active');
    }

    function switchReportTab(type){
      // 保存当前编辑内容
      var ta=document.getElementById('reportContent');
      if(currentReportType&&ta.value){
        reportEdits[currentReportType]=ta.value;
      }
      currentReportType=type;
      document.getElementById('tabDaily').classList.toggle('active',type==='daily');
      document.getElementById('tabWeekly').classList.toggle('active',type==='weekly');
      // 如果有已保存的编辑内容，用编辑内容；否则生成新报告
      if(reportEdits[type]){
        ta.value=reportEdits[type];
      } else {
        renderReport();
      }
    }

    function regenerateReport(){
      // 清除当前类型的编辑缓存，强制重新生成
      delete reportEdits[currentReportType];
      renderReport();
      showToast('已从任务数据重新生成');
    }

    function saveReportAuthor(){
      localStorage.setItem('pmReportAuthor',document.getElementById('reportAuthor').value.trim());
    }

    function fmtDateMD(s){var d=parseDate(s);if(!d)return '';return (d.getMonth()+1)+'.'+d.getDate()}

    /* 动作动词前缀：老板视角，技术动作→业务价值 */
    var ACTION_VERBS=['完成','新增','上线','发布','优化','推进','组织','输出','梳理','设计','绘制','接入','测试','验证','修复','调研','评估','跟进','拉通','确定','整理','准备','主持','跟踪','明确','确认','监控','总结','验收','通过','搭建','开发','启动','撰写','制作','对比','分析','协调','推动','制定','打通','升级','迭代','调整','配置','打通'];
    function ensureVerb(name,category){
      var n=String(name||'').trim();
      if(!n)return n;
      var head=n.substring(0,4);
      for(var i=0;i<ACTION_VERBS.length;i++){
        if(head.indexOf(ACTION_VERBS[i])===0)return n;
      }
      var verbMap={'需求分析':'完成','原型设计':'完成','数据分析':'完成','上线发布':'上线','竞品分析':'完成','项目协调':'推进','技术接入':'完成','测试验收':'完成','会议协调':'组织','其他':'完成'};
      return (verbMap[category]||'完成')+n;
    }

    /* 排除非本周执行类内容（Q2复盘、Q3规划等） */
    function isExcludedReport(name){
      return /复盘|规划|Q2|Q3|季度|半年度|年度|OKR/.test(String(name||''));
    }

    function isCarriedOver(t,monDate){
      var cd=parseDate(t['创建日期']);
      return cd&&cd<monDate;
    }

    function plOfTask(t){
      return t['项目线']||classifyProjectLine(t['任务名称']);
    }

    /* 周报：按项目线分组 + 三段式（本周进展/关键结论·数据/下周计划） */
    function buildWeeklyReport(){
      var now=new Date();
      var day=now.getDay()||7;
      var mon=new Date(now);mon.setDate(now.getDate()-day+1);mon.setHours(0,0,0,0);
      var sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
      var author=document.getElementById('reportAuthor').value.trim();

      var completed=allTasks.filter(function(t){
        return t['状态']==='已完成'&&isThisWeek(t['完成日期'])&&!isExcludedReport(t['任务名称']);
      });
      var inProgress=allTasks.filter(function(t){return t['状态']==='进行中'&&!isExcludedReport(t['任务名称'])});
      var todo=allTasks.filter(function(t){return t['状态']==='待办'&&!isExcludedReport(t['任务名称'])});

      var lines=[];
      lines.push('【AI板块周报】'+(author?author+' | ':'')+fmtDateMD(mon.toISOString())+' - '+fmtDateMD(sun.toISOString()));
      lines.push('');

      var plNames=PROJECT_LINES.map(function(p){return p.name}).concat('其他');
      var usedPl=[];
      plNames.forEach(function(plName){
        var done=completed.filter(function(t){return plOfTask(t)===plName});
        var next=todo.concat(inProgress).filter(function(t){return plOfTask(t)===plName});
        if(done.length===0&&next.length===0)return;
        usedPl.push(plName);
        lines.push(CN_NUM[usedPl.length]+'、'+plName);
        // 本周进展：完成了什么（动词开头）
        lines.push('【本周进展】');
        if(done.length===0){
          lines.push('  - 本周无完成项，项目线持续推进中');
        } else {
          done.forEach(function(t,i){
            var carry=isCarriedOver(t,mon)?'（延续上周）':'';
            lines.push('  '+(i+1)+'. '+ensureVerb(t['任务名称'],t['分类'])+' ['+(t['优先级']||'P2')+']'+carry);
          });
        }
        // 关键结论/数据：测试结论、量化对比
        var conclusions=done.filter(function(t){return t['任务描述']});
        if(conclusions.length>0){
          lines.push('【关键结论/数据】');
          conclusions.forEach(function(t){
            lines.push('  - '+t['任务描述']);
          });
        }
        // 下周计划：下一步动作
        lines.push('【下周计划】');
        if(next.length===0){
          lines.push('  - 暂无排期');
        } else {
          next.slice(0,8).forEach(function(t,i){
            lines.push('  '+(i+1)+'. '+ensureVerb(t['任务名称'],t['分类'])+' ['+(t['优先级']||'P2')+']');
          });
          if(next.length>8)lines.push('  ...等共 '+next.length+' 项');
        }
        lines.push('');
      });

      if(usedPl.length===0){
        lines.push('（本周暂无任务数据）');
        lines.push('');
      }

      // 本周总结
      lines.push('【本周总结】');
      lines.push('- 本周完成 '+completed.length+' 项任务');
      lines.push('- 进行中 '+inProgress.length+' 项，待办 '+todo.length+' 项');
      return lines.join('\n');
    }

    function renderReport(){
      if(currentReportType==='weekly'){
        currentReportText=buildWeeklyReport();
        document.getElementById('reportContent').value=currentReportText;
        return;
      }

      var today=todayStr();
      var completed, title, period;

      if(currentReportType==='daily'){
        completed=allTasks.filter(function(t){
          return t['状态']==='已完成'&&isToday(t['完成日期']);
        });
        title='【今日工作日报】';
        period='日期：'+today;
      } else {
        completed=allTasks.filter(function(t){
          return t['状态']==='已完成'&&isThisWeek(t['完成日期']);
        });
        var now=new Date();
        var day=now.getDay()||7;
        var mon=new Date(now);mon.setDate(now.getDate()-day+1);
        var sun=new Date(mon);sun.setDate(mon.getDate()+6);
        title='【本周工作周报】';
        period='周期：'+fmtDate(mon.toISOString())+' ~ '+fmtDate(sun.toISOString());
      }

      var inProgress=allTasks.filter(function(t){return t['状态']==='进行中'});
      var todo=allTasks.filter(function(t){
        if(t['状态']!=='待办')return false;
        if(currentReportType==='daily'){
          return isToday(t['截止日期'])||isOverdue(t);
        }
        return true;
      });

      var lines=[];
      lines.push(title);
      lines.push(period);
      lines.push('');

      lines.push('一、'+(currentReportType==='daily'?'今日':'本周')+'完成');
      if(completed.length===0){
        lines.push('  （暂无完成项）');
      } else {
        completed.forEach(function(t,i){
          lines.push((i+1)+'. ['+(t['优先级']||'P2')+'] '+t['任务名称']+'（'+(t['分类']||'其他')+'）');
          if(t['任务描述'])lines.push('    '+t['任务描述']);
        });
      }
      lines.push('');

      lines.push('二、进行中');
      if(inProgress.length===0){
        lines.push('  （暂无进行中任务）');
      } else {
        inProgress.forEach(function(t,i){
          lines.push((i+1)+'. ['+(t['优先级']||'P2')+'] '+t['任务名称']+'（'+(t['分类']||'其他')+'）');
        });
      }
      lines.push('');

      lines.push('三、'+(currentReportType==='daily'?'明日':'下周')+'计划');
      if(todo.length===0){
        lines.push('  （暂无待办任务）');
      } else {
        todo.slice(0,10).forEach(function(t,i){
          lines.push((i+1)+'. ['+(t['优先级']||'P2')+'] '+t['任务名称']);
        });
        if(todo.length>10)lines.push('  ...等共 '+todo.length+' 项待办');
      }
      lines.push('');

      lines.push('四、'+(currentReportType==='daily'?'今日':'本周')+'总结');
      lines.push('- 完成'+(currentReportType==='daily'?'今日':'本周')+'任务 '+completed.length+' 项');
      lines.push('- 进行中任务 '+inProgress.length+' 项');
      lines.push('- 待办任务 '+todo.length+' 项');

      currentReportText=lines.join('\n');
      document.getElementById('reportContent').value=currentReportText;
    }

    function closeReportModal(){
      // 关闭前保存当前编辑
      var ta=document.getElementById('reportContent');
      if(currentReportType&&ta.value){
        reportEdits[currentReportType]=ta.value;
      }
      document.getElementById('reportModalOverlay').classList.remove('active');
    }

    function copyReport(){
      var text=document.getElementById('reportContent').value;
      if(!text){showToast('报告内容为空',true);return;}
      if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(function(){showToast('已复制到剪贴板')}).catch(function(){fallbackCopy(text)});
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text){
      var ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed';
      ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();
      try{document.execCommand('copy');showToast('已复制到剪贴板')}catch(e){showToast('复制失败，请手动选择文本复制',true)}
      document.body.removeChild(ta);
    }

    function downloadReport(){
      var text=document.getElementById('reportContent').value;
      if(!text){showToast('报告内容为空',true);return;}
      var type=currentReportType==='daily'?'日报':'周报';
      var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;
      a.download='工作'+type+'_'+todayStr()+'.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已下载 '+type);
    }

    /* ===== Export / Import ===== */
    function exportData(){
      var data=JSON.stringify(allTasks,null,2);
      var blob=new Blob([data],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;
      a.download='PM工作台备份_'+todayStr()+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已导出 '+allTasks.length+' 条数据');
    }

    function importData(event){
      var file=event.target.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var data=JSON.parse(e.target.result);
          if(!Array.isArray(data)){showToast('文件格式不正确',true);return}
          var valid=data.filter(function(t){return t['任务名称']});
          if(valid.length===0){showToast('文件中没有有效任务',true);return}
          var promises=valid.map(function(t){
            var importProps={
              '任务名称':{'text':t['任务名称']||''},
              '任务描述':{'text':t['任务描述']||''},
              '状态':{'select':selectVal('状态',t['状态']||'待办')},
              '优先级':{'select':selectVal('优先级',t['优先级']||'P2')},
              '分类':{'select':selectVal('分类',t['分类']||'其他')},
              '项目线':{'select':selectVal('项目线',t['项目线']||classifyProjectLine(t['任务名称']))},
              '截止日期':{'date':fmtDate(t['截止日期'])||todayStr()},
              '创建日期':{'date':fmtDate(t['创建日期'])||todayStr()},
              '来源':{'select':selectVal('来源',t['来源']||'手动添加')}
            };
            var compDate=fmtDate(t['完成日期']);
            if(compDate){importProps['完成日期']={'date':compDate}}
            return DataStore.addRecord(importProps);
          });
          Promise.all(promises).then(function(){
            showToast('已导入 '+valid.length+' 条任务');
            loadData();
          }).catch(function(){showToast('部分导入失败',true)});
        } catch(err){
          showToast('文件解析失败',true);
        }
        event.target.value='';
      };
      reader.readAsText(file);
    }

    /* ===== Data Count Check ===== */
    function checkDataCount(){
      if(allTasks.length>=30){
        var key='wb_pm_backup_reminded';
        var last=localStorage.getItem(key);
        var today=todayStr();
        if(last!==today){
          localStorage.setItem(key,today);
          showToast('数据已积累 '+allTasks.length+' 条，建议导出备份',true);
        }
      }
    }

    /* ===== Load & Init ===== */
    function loadData(){
      DataStore.queryAll().then(function(tasks){
        allTasks=tasks||[];
        renderAll();
      });
    }

    function init(){
      // Load learning data
      loadLearning();

      // Restore report author name
      var authorEl=document.getElementById('reportAuthor');
      if(authorEl){
        authorEl.value=localStorage.getItem('pmReportAuthor')||'';
      }

      // Sync status
      var syncEl=document.getElementById('syncDot');
      var syncText=document.getElementById('syncText');
      if(hasSDK){
        syncEl.classList.remove('offline');
        syncText.textContent='已同步';
      } else {
        syncEl.classList.add('offline');
        syncText.textContent='离线模式';
      }

      // Date badge
      var now=new Date();
      var weekdays=['日','一','二','三','四','五','六'];
      document.getElementById('dateBadge').textContent=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' 周'+weekdays[now.getDay()];

      // Load schema then data
      DataStore.getSchema().then(function(){
        loadData();
      });

      // Close modal on overlay click
      document.getElementById('taskModalOverlay').addEventListener('click',function(e){
        if(e.target===this)closeTaskModal();
      });
      document.getElementById('reportModalOverlay').addEventListener('click',function(e){
        if(e.target===this)closeReportModal();
      });
      document.getElementById('confirmOverlay').addEventListener('click',function(e){
        if(e.target===this)closeConfirm();
      });
      document.getElementById('learnOverlay').addEventListener('click',function(e){
        if(e.target===this)closeLearnPanel();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown',function(e){
        if(e.key==='Escape'){
          closeTaskModal();
          closeReportModal();
          closeConfirm();
          closeLearnPanel();
        }
        if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
          if(document.getElementById('aiInput')===document.activeElement){
            runDecompose();
          }
        }
      });
    }

    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',init);
    } else {
      init();
    }
  </script>
